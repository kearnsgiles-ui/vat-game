<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>增值税会计大闯关</title>
<style>
:root{
  --ink:#25255C; --sky:#BFE9FF; --sun:#FFD447; --coral:#FF6F6F; --mint:#3FD9A0; --grape:#8E7DFF;
  --paper:#fff; --soft:#EAF6FF; --gold:#FFD447; --silver:#DCE3EE; --bronze:#FFB98A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color:var(--ink); background:var(--sky);
  background-image:radial-gradient(rgba(255,255,255,.75) 2.5px,transparent 2.5px);
  background-size:28px 28px; min-height:100vh; line-height:1.6;
}
#app{max-width:560px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:17px;
  padding:12px 20px;border:3px solid var(--ink);border-radius:16px;background:var(--sun);cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.mint{background:var(--mint)} .btn.coral{background:var(--coral);color:#fff}
.btn.grape{background:var(--grape);color:#fff} .btn.white{background:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px dashed var(--grape);outline-offset:3px}
.link{background:none;border:0;font-weight:800;color:var(--grape);cursor:pointer;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.icon-btn{width:46px;height:46px;flex:none;border:3px solid var(--ink);border-radius:15px;background:#fff;
  font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icon-btn.trophy{background:var(--sun)}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.who b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;opacity:.7}
.pts{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:5px 14px;font-weight:900;box-shadow:0 3px 0 var(--ink);white-space:nowrap}

/* 首页 */
.home{text-align:center;padding-top:10px}
.mascot{width:112px;margin:0 auto 4px;animation:bob 2.4s ease-in-out infinite}
.mascot svg{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.title{display:inline-block;background:var(--sun);border:3px solid var(--ink);border-radius:18px;padding:8px 20px;
  font-size:31px;font-weight:900;letter-spacing:2px;box-shadow:0 6px 0 var(--ink);transform:rotate(-2deg);margin:6px 0 14px}
.sub{font-weight:700;margin-bottom:18px}
.form{padding:18px;text-align:left;display:grid;gap:14px}
.form label{display:grid;gap:6px;font-weight:800}
.form input{font:inherit;font-weight:700;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--soft);color:var(--ink);width:100%}
.form input:focus{outline:3px dashed var(--grape);outline-offset:2px;background:#fff}
.err{min-height:22px;color:#D93B3B;font-weight:800;font-size:14px}
.mini{margin-top:20px;padding:14px;text-align:left}
.mini-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

/* 排行榜行 */
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:3px solid var(--ink);border-radius:16px;background:#fff}
.row.r1{background:var(--gold)} .row.r2{background:var(--silver)} .row.r3{background:var(--bronze)}
.row.me{outline:3px dashed var(--grape);outline-offset:2px}
.rk{width:38px;height:38px;flex:none;display:grid;place-items:center;font-weight:900;font-size:20px;border-radius:50%;background:var(--soft);border:2px solid var(--ink)}
.row.r1 .rk,.row.r2 .rk,.row.r3 .rk{background:transparent;border:0;font-size:28px}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.nm b{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm i{font-style:normal;font-size:12px;background:var(--grape);color:#fff;border-radius:8px;padding:0 6px;flex:none}
.nm span{font-size:13px;opacity:.75}
.sc{text-align:right;display:flex;flex-direction:column;line-height:1.25}
.sc b{font-size:22px} .sc span{font-size:12px;opacity:.75;white-space:nowrap}
.empty{padding:14px;text-align:center;font-weight:700;opacity:.7}

/* 关卡地图 */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hello .bubble{flex:1;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:0 4px 0 var(--ink)}
.hello .mascot{width:64px;margin:0;flex:none}
.levels{position:relative;display:grid;gap:14px}
.levels::before{content:"";position:absolute;left:44px;top:20px;bottom:20px;border-left:5px dotted var(--ink);opacity:.35}
.lv{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;background:#fff;
  border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.node{width:56px;height:56px;flex:none;display:grid;place-items:center;font-size:28px;border:3px solid var(--ink);border-radius:50%}
.lv-body{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.lv-body b{font-size:17px} .lv-body small{font-size:13px;opacity:.75}
.lv-side{font-size:13px;font-weight:800;text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--sun)}
.tag.done{background:var(--mint)}
.lv.locked{background:#E7ECF3;box-shadow:0 5px 0 #8E96AA;border-color:#8E96AA;color:#6B7390}
.lv.locked .node{background:#CDD4E0!important;border-color:#8E96AA}
.lv.shake{animation:shake .4s}
.board-strip{margin-top:22px;padding:14px}

/* 知识点 */
.stage-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stage-head .node{width:46px;height:46px;font-size:22px}
.stage-head h2{font-size:20px;line-height:1.3} .stage-head small{display:block;font-size:13px;font-weight:700;opacity:.75}
.viewport{overflow:hidden;border-radius:24px;padding:0 0 8px}
.track{display:flex;transition:transform .35s cubic-bezier(.3,.8,.3,1);touch-action:pan-y}
.slide{flex:0 0 100%;padding:0 4px}
.kcard{height:100%;padding:20px 18px;border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--ink)}
.kcard h3{font-size:21px;line-height:1.35;margin-bottom:10px}
.kcard p{margin-bottom:10px}
.kcard ul{margin:0 0 6px;padding-left:20px} .kcard li{margin-bottom:6px}
.chips{list-style:none!important;padding:0!important;display:flex;flex-wrap:wrap;gap:8px}
.chips li{margin:0!important;padding:5px 12px;border:2px solid var(--ink);border-radius:999px;font-weight:800;font-size:15px}
.chips li:nth-child(4n+1){background:#FFE9A0}.chips li:nth-child(4n+2){background:#CFF7E6}
.chips li:nth-child(4n+3){background:#E0DBFF}.chips li:nth-child(4n){background:#FFD3D3}
.hl{display:block;text-align:center;font-size:22px;font-weight:900;background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:12px;margin:8px 0}
.formula{background:var(--soft);border:2px dashed var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0;font-weight:700;font-size:15px}
.formula em{font-style:normal;background:var(--coral);color:#fff;border-radius:8px;padding:0 6px;margin:0 2px}
.entry{background:#FFF8DC;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px;font-weight:700;line-height:1.7}
table{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin:6px 0;font-size:14px}
th,td{padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--grape);color:#fff} td+th,th+th,td+td{border-left:2px solid var(--ink)}
tr+tr td{border-top:2px solid var(--ink)}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}
.dots{display:flex;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dot.on{background:var(--coral);width:28px;border-radius:999px}

/* 答题 */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar{flex:1;height:16px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-right:3px solid var(--ink);transition:width .3s}
.qhead .pts{font-size:14px;padding:3px 12px}
.qcard{padding:18px;margin-bottom:14px}
.qcard .qn{display:inline-block;background:var(--grape);color:#fff;font-weight:800;font-size:13px;padding:2px 12px;border-radius:999px;margin-bottom:8px}
.qcard p{font-size:18px;font-weight:800;line-height:1.55}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:12px;background:#fff;border:3px solid var(--ink);border-radius:18px;
  box-shadow:0 4px 0 var(--ink);cursor:pointer;font-weight:700;line-height:1.5}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ltr{flex:none;width:32px;height:32px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--sun);font-weight:900}
.opt.right{background:#C9F6E2} .opt.right .ltr{background:var(--mint)}
.opt.wrong{background:#FFD3D3;animation:shake .4s} .opt.wrong .ltr{background:var(--coral);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.explain{margin-top:14px;padding:14px 16px;border:3px solid var(--ink);border-radius:18px;font-weight:700}
.explain.ok{background:#C9F6E2} .explain.no{background:#FFE3E3}
.explain b{display:block;font-size:17px;margin-bottom:2px}
.explain .btn{margin-top:12px}
.plus{position:fixed;z-index:100;font-weight:900;font-size:26px;color:#0B9B66;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;pointer-events:none;animation:rise .9s ease-out forwards}
@keyframes rise{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-60px);opacity:0}}

/* 结算 */
.res-card{padding:22px 18px;text-align:center;animation:pop-in .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop-in{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.big-emoji{font-size:60px;line-height:1.1}
.res-card h2{font-size:28px;margin:4px 0 2px}
.res-card .need{font-weight:700;opacity:.75;margin-bottom:14px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat3 div{border:3px solid var(--ink);border-radius:16px;padding:8px 4px;background:var(--soft)}
.stat3 b{display:block;font-size:24px;line-height:1.3} .stat3 span{font-size:12px;font-weight:700;opacity:.75}
.rankline{background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:8px;font-weight:800;margin-bottom:14px}
.rankline b{font-size:22px}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}

/* 弹窗 */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(37,37,92,.55);display:grid;place-items:center;padding:20px}
.modal{width:min(360px,100%);padding:26px 20px;text-align:center;animation:pop-in .5s cubic-bezier(.2,1.4,.4,1)}
.modal .big-emoji{font-size:70px}
.modal h2{font-size:28px;margin:6px 0} .modal p{font-weight:700;margin-bottom:16px}

/* 排行榜页 */
.board-title{flex:1;font-size:24px;font-weight:900}
.board-card{padding:14px}
.me-line{margin:0 0 12px;padding:8px 12px;border:3px dashed var(--grape);border-radius:14px;font-weight:800;text-align:center;background:#F3F0FF}
.note{margin-top:14px;font-size:12px;font-weight:700;opacity:.7;text-align:center}

/* 特效 */
.bit{position:fixed;z-index:100;width:10px;height:10px;border-radius:3px;pointer-events:none;animation:fly 1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}


/* 教师看板 */
.t-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.t-tools select{font:inherit;font-weight:700;padding:9px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--soft);color:var(--ink);flex:1;min-width:120px}
.t-sum{font-weight:800;margin-bottom:10px}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px 6px}
.tt{min-width:640px;font-size:13px;white-space:nowrap}
.tt td:nth-child(n+4){text-align:center} .tt th:nth-child(n+4){text-align:center}
.tt tr:nth-child(even) td{background:#F5FAFF}

@media (min-width:700px){
  #app{max-width:620px;padding-top:32px}
  .title{font-size:38px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .bit{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ 题库 ============ */
const L = [
{
  name:'科目入门', sub:'增值税科目大家庭', emoji:'📒', color:'#FFD447', pass:40,
  cards:[
    {t:'二级科目新增了7个', h:`<p>根据 <b>财会〔2016〕22号文</b>，“应交税费”下新增 <b>7个</b> 二级科目：</p>
      <ul class="chips"><li>预交增值税</li><li>待抵扣进项税额</li><li>待认证进项税额</li><li>待转销项税额</li><li>简易计税</li><li>转让金融商品应交增值税</li><li>代扣代交增值税</li></ul>`},
    {t:'三级科目新增1个', h:`<p>“应交税费—应交增值税”下新增三级明细科目：</p><span class="hl">销项税额抵减</span>`},
    {t:'“未交增值税”核什么', h:`<p>核算<b>未缴、多缴、预缴</b>的增值税，平时无发生额。</p>
      <ul><li>贷方余额 → 转入“未交增值税”贷方（转出未交增值税）</li>
      <li>多缴/预缴 → 转入“未交增值税”借方（转出多交增值税/结转预缴增值税）</li></ul>`}
  ],
  qs:[
    {q:'增值税会计核算中，“应交税费”二级科目新增了多少个？', o:['5个','6个','7个','8个'], a:2, e:'根据财会〔2016〕22号文，新增了7个二级科目。'},
    {q:'下列哪个不是“应交税费”下新增的二级科目？', o:['预交增值税','待抵扣进项税额','进项税额','简易计税'], a:2, e:'“进项税额”是“应交税费—应交增值税”下的三级专栏，不是新增的二级科目。'},
    {q:'“应交税费—应交增值税”下新增的三级科目是？', o:['进项税额转出','销项税额抵减','已交税金','出口退税'], a:1, e:'新增了“销项税额抵减”三级明细科目。'},
    {q:'月末“应交税费—应交增值税”为贷方余额时，应转入哪个科目？', o:['应交税费—预交增值税','应交税费—未交增值税（贷方）','应交税费—待抵扣进项税额','应交税费—简易计税'], a:1, e:'贷方余额表示未缴增值税，转入“未交增值税”贷方，对应分录为“转出未交增值税”。'},
    {q:'“应交税费—未交增值税”科目平时有发生额吗？', o:['有，每月都有','没有，平时无发生额','只有借方发生额','只有贷方发生额'], a:1, e:'该科目平时无发生额，月末结转和次月初缴纳时才使用。'}
  ]
},
{
  name:'资金调度', sub:'未交增值税的爱恨情仇', emoji:'💰', color:'#3FD9A0', pass:40,
  cards:[
    {t:'已交税金 vs 未交增值税', h:`<table><tr><th>科目</th><th>用途</th></tr>
      <tr><td>应交增值税（已交税金）</td><td>交纳<b>当月</b>应交的增值税</td></tr>
      <tr><td>未交增值税</td><td>结转<b>以前期间</b>未交/多交/预缴的增值税</td></tr></table>`},
    {t:'纳税申报期限', h:`<ul><li>以 <b>1个月或1个季度</b> 为纳税期：期满之日起 <b>15日内</b> 申报</li>
      <li>以 <b>1日、3日、5日、10日或15日</b> 为纳税期：期满之日起 <b>5日内</b> 预缴</li></ul>`},
    {t:'欠税与留抵的对冲', h:`<p><b>欠税 &gt; 留抵税额</b>：按留抵税额对冲</p>
      <div class="entry">借：应交税费—应交增值税(进项税)　红字留抵<br>贷：应交税费—未交增值税　红字</div>
      <p><b>欠税 &lt; 留抵税额</b>：按欠税额对冲，剩余留抵继续结转</p>
      <div class="entry">借：应交税费—应交增值税(进项税)　红字欠税<br>贷：应交税费—未交增值税　红字</div>`}
  ],
  qs:[
    {q:'企业当月用银行存款交纳当月增值税，应借记哪个科目？', o:['应交税费—未交增值税','应交税费—应交增值税(已交税金)','应交税费—预交增值税','应交税费—简易计税'], a:1, e:'交纳当月增值税走“已交税金”专栏；交纳以前期间未交的走“未交增值税”。'},
    {q:'纳税人以1个月为一个纳税期的，应自期满之日起多少日内申报纳税？', o:['5日','10日','15日','30日'], a:2, e:'以1个月或1个季度为纳税期的，自期满之日起15日内申报纳税。'},

      try{
        const row={id:this.key(e),name:e.name,class_name:e.className,score:e.score,cleared:e.clearedLevels,
          time:e.time,level_scores:e.levelScores||null,updated_at:new Date().toISOString()};
        const r=await sb('scores?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)});
        this.lastErr=!r.ok; return r.ok;
      }catch(err){ this.lastErr=true; return false; }
    }
    if (this.mode==='shared'){
      try{ await window.storage.set(this.key(e), JSON.stringify(e), true); return true; }catch(err){ return false; }
    }
    const all = await this.loadAll();
    const i = all.findIndex(x=>x.name===e.name && x.className===e.className);
    if (i>=0) all[i]=e; else all.push(e);
    if (this.mode==='local'){ try{ localStorage.setItem(this.LS, JSON.stringify(all)); }catch(err){} }
    else this.mem = all;
    return true;
  },
  note(){
    const warn = this.cloudFail ? `⚠️ 云端连接失败（${esc(this.cloudFail)}），当前只是本地排行榜。<br>` : '';
    const bad = (this.mode==='cloud' && this.lastErr) ? '⚠️ 刚才与云端通信失败，请检查网络后点右上角刷新。<br>' : '';
    return warn + bad + (
      this.mode==='cloud'  ? '排行榜为全班共享，通关后成绩自动上传，点右上角 ↻ 可刷新。'
    : this.mode==='shared' ? '排行榜由所有玩家共享，成绩会实时更新。'
    : this.mode==='local'  ? '排行榜保存在当前浏览器（localStorage），换设备后不会同步。'
    : '当前环境无法持久保存，刷新页面后排行榜会重置。');
  }
};
async function ranking(){
  const all = await Store.loadAll();
  return all.sort((a,b)=> b.score-a.score || a.time-b.time || String(a.name).localeCompare(String(b.name)));
}

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2200);
}
function bit(x,y,dx,dy,color,dur){
  const b=document.createElement('i'); b.className='bit';
  b.style.cssText=`left:${x}px;top:${y}px;background:${color};--dx:${dx}px;--dy:${dy}px;--r:${Math.random()*720-360}deg;animation-duration:${dur}ms`;
  document.body.appendChild(b); setTimeout(()=>b.remove(),dur+100);
}
const COLORS=['#FFD447','#FF6F6F','#3FD9A0','#8E7DFF','#5CC8FF','#FF9F43'];
function burst(x,y,n=26,spread=140){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, d=spread*(.4+Math.random()*.6);
    bit(x,y,Math.cos(a)*d,Math.sin(a)*d+spread*.5,COLORS[i%COLORS.length],800+Math.random()*400);
  }
}
function rain(n=80){
  for(let i=0;i<n;i++){
    setTimeout(()=>bit(Math.random()*innerWidth,-10,(Math.random()-.5)*160,innerHeight*(.8+Math.random()*.4),COLORS[i%COLORS.length],1800+Math.random()*1400),Math.random()*500);
  }
}
function countUp(el,to,dur=700){
  const t0=performance.now();
  (function f(t){ const p=Math.min(1,(t-t0)/dur); el.textContent=Math.round(to*p); if(p<1) requestAnimationFrame(f); })(t0);
}

function answer(i){
  if(S.answered) return; S.answered=true;
  const lv=L[S.level], q=lv.qs[S.q];
  const dt=Math.min(90,(Date.now()-S.qStart)/1000); S.time+=dt; S.runTime+=dt;
  const ok=i===q.a; if(ok) S.run++;
  const btns=[...document.querySelectorAll('#opts .opt')];
  btns.forEach((b,k)=>{ b.disabled=true;
    if(k===q.a) b.classList.add('right'); else if(k===i) b.classList.add('wrong'); else b.classList.add('dim'); });
  const last=S.q===lv.qs.length-1;
  $('#explain').innerHTML=`<div class="explain ${ok?'ok':'no'}"><b>${ok?'🎉 答对了 +10分':'😵 答错了，正确答案是 '+LT[q.a]}</b>${esc(q.e)}
    <button class="btn ${ok?'mint':'coral'} block" data-act="next">${last?'查看结算':'下一题'}</button></div>`;
  if(ok){
    const r=btns[i].getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2);
    const p=document.createElement('div'); p.className='plus'; p.textContent='+10';
    p.style.left=(r.left+r.width/2)+'px'; p.style.top=(r.top)+'px'; document.body.appendChild(p); setTimeout(()=>p.remove(),950);
  }
  $('#explain').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function nextQ(){

async function finishLevel(){
  const lv=L[S.level], sc=S.run*10, max=lv.qs.length*10;
  const wasCleared=S.scores[S.level]>=lv.pass;
  S.scores[S.level]=Math.max(S.scores[S.level],sc);
  const passed=sc>=lv.pass;
  await saveProgress();
  const list=await ranking(); const rank=list.findIndex(isMe)+1;
  renderResult({sc,max,passed,newClear:passed&&!wasCleared,rank,n:list.length});
}
async function saveProgress(){
  const ok = await Store.save({name:S.player.name,className:S.player.cls,score:total(),clearedLevels:cleared(),
    time:Math.round(S.time),date:new Date().toISOString().slice(0,10),levelScores:S.scores.slice()});

}
function renderResult(r){
  S.screen='result';
  const lv=L[S.level], hasNext=S.level<L.length-1 && S.scores[S.level]>=lv.pass;

      <div><b>${acc}%</b><span>正确率</span></div>
      <div><b id="cTot">0</b><span>累计总分</span></div></div>
    <div class="rankline">${r.rank?`你现在排第 <b>${r.rank}</b> 名（共 ${r.n} 人）`:'再闯一关就能上榜'}</div>
    <div class="btns">
      ${r.passed && hasNext?`<button class="btn mint block" data-act="level" data-arg="${S.level+1}">前往第${S.level+2}关</button>`:''}
      ${!r.passed?`<button class="btn coral block" data-act="startQuiz">再闯一次</button>`:''}
      <div class="btns two">
        ${!r.passed?`<button class="btn white" data-act="relearn">重看知识点</button>`:`<button class="btn white" data-act="map">关卡地图</button>`}
        <button class="btn grape" data-act="board">🏆 排行榜</button></div>
      ${!r.passed?`<button class="btn white block" data-act="map">回关卡地图</button>`:''}
    </div></div>`;
  countUp($('#cSc'),r.sc); countUp($('#cTot'),total());
  if(r.passed){
    rain(r.newClear?70:35);

      setTimeout(()=>showModal(allDone
        ? `<div class="big-emoji">👑</div><h2>全部通关！</h2><p>总分 ${total()} / ${MAX_TOTAL}，用时 ${Math.round(S.time)} 秒<br>${r.rank?`当前排名第 ${r.rank} 名`:''}</p><button class="btn mint block" data-act="closeModal">看结算</button>`
        : `<div class="big-emoji">🔓</div><h2>通关成功！</h2><p>第${S.level+2}关已解锁<br>${r.rank?`你目前排第 ${r.rank} 名`:''}</p><button class="btn mint block" data-act="closeModal">继续</button>`),450);
    }
  }
}

  const head=['排名','姓名','班级','总分','通关数','用时(秒)',...L.map((l,i)=>`第${i+1}关`),'更新时间'];
  const lines=[head,...teacherRows().map((e,i)=>[i+1,e.name,e.className,e.score,e.clearedLevels,e.time,
    ...L.map((l,k)=>e.levelScores&&e.levelScores[k]!=null?e.levelScores[k]:''),fmtTime(e.updated||e.date)])];
  const csv='\ufeff'+lines.map(r=>r.map(safe).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='增值税闯关成绩.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function teacherLogin(){
  if($('#tPwd').value===TEACHER_PWD) renderTeacher(); else renderTeacherGate('密码不对');
}

/* ============ 事件分发 ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.classList.contains('overlay') && e.target!==t) return;
  const a=t.dataset.act, arg=t.dataset.arg===undefined?undefined:Number(t.dataset.arg);
  switch(a){
    case 'start': startGame(); break;
    case 'home': if(location.hash) history.replaceState(null,'',location.pathname+location.search); renderHome(); break;
    case 'tLogin': teacherLogin(); break;
    case 'tRefresh': renderTeacher(); break;
    case 'csv': downloadCsv(); break;
    case 'map': renderMap(); break;
    case 'board': renderBoard(); break;
    case 'boardBack': (S.from==='home'||!S.player) ? renderHome() : renderMap(); break;
    case 'refresh': renderBoard(); toast('已刷新'); break;
    case 'level':
      if(!unlocked(arg)){ t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
        toast(`先通过第${arg}关（至少 ${L[arg-1].pass} 分）`); break; }
      S.level=arg; renderLearn(); break;
    case 'prevCard': setCard(S.card-1); break;
    case 'nextCard': setCard(S.card+1); break;
    case 'startQuiz': startQuiz(); break;
    case 'relearn': renderLearn(); break;
    case 'ans': answer(arg); break;
    case 'next': nextQ(); break;
    case 'closeModal': closeModal(); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && S.screen==='home' && e.target.tagName==='INPUT') startGame();
  if(e.key==='Enter' && e.target.id==='tPwd') teacherLogin();
  if(S.screen==='learn'){ if(e.key==='ArrowLeft') setCard(S.card-1); if(e.key==='ArrowRight') setCard(S.card+1); }
  if(S.screen==='quiz'){
    const i='abcd'.indexOf(e.key.toLowerCase());
    if(i>=0 && !S.answered) answer(i);
    else if(e.key==='Enter' && S.answered) nextQ();
  }
});

document.addEventListener('change',e=>{ if(e.target.id==='tCls'){ TL.cls=e.target.value; drawTeacher(); } });
window.addEventListener('hashchange',()=>{ if(location.hash==='#teacher') renderTeacherGate(); });
Store.init().then(()=> location.hash==='#teacher' ? renderTeacherGate() : renderHome());
</script>
</body>
</html>
